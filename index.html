<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetVision ATS — Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#3b82f6;
  --cyan:#06b6d4;
  --gold:#f59e0b;
  --text:#e2e8f0;
  --muted:#64748b;
  --dark:#050a18;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;overflow:hidden;background:#000;}

/* ═══════ UNIVERSE CANVAS ═══════ */
#universe{position:fixed;inset:0;z-index:0;}
#star-canvas{position:absolute;inset:0;pointer-events:none;}

/* ═══════ SUN SYSTEM ═══════ */
.solar{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/* Sun */
#sun{
  position:absolute;left:50%;top:50%;
  width:80px;height:80px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 38% 32%,#fff7cc 0%,#ffe44d 20%,#ffaa00 50%,#ff6600 78%,#cc2200 100%);
  box-shadow:
    0 0 0 8px rgba(255,180,0,0.12),
    0 0 30px 8px rgba(255,200,0,0.7),
    0 0 70px 20px rgba(255,130,0,0.5),
    0 0 140px 50px rgba(255,80,0,0.3),
    0 0 280px 100px rgba(255,50,0,0.15),
    0 0 500px 200px rgba(255,30,0,0.06);
  animation:sunPulse 3.5s ease-in-out infinite;
  z-index:20;
}
@keyframes sunPulse{
  0%,100%{box-shadow:0 0 0 8px rgba(255,180,0,0.12),0 0 30px 8px rgba(255,200,0,0.7),0 0 70px 20px rgba(255,130,0,0.5),0 0 140px 50px rgba(255,80,0,0.3),0 0 280px 100px rgba(255,50,0,0.15);}
  50%{box-shadow:0 0 0 12px rgba(255,200,0,0.18),0 0 50px 15px rgba(255,220,0,0.85),0 0 100px 35px rgba(255,150,0,0.6),0 0 200px 75px rgba(255,100,0,0.35),0 0 380px 140px rgba(255,60,0,0.18);}
}

/* Sun flares */
.flare{
  position:absolute;left:50%;top:50%;
  border-radius:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,180,0,0.15);
  animation:coronaGlow 6s ease-in-out infinite;
}
.flare:nth-child(1){width:130px;height:130px;border-color:rgba(255,200,0,0.25);}
.flare:nth-child(2){width:180px;height:180px;animation-delay:-2s;animation-duration:9s;}
.flare:nth-child(3){width:250px;height:250px;animation-delay:-4s;animation-duration:12s;border-color:rgba(255,120,0,0.1);}
@keyframes coronaGlow{
  0%,100%{opacity:0.5;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.05);}
}

/* Orbit paths — elliptical tilt */
.orbit-path{
  position:absolute;left:50%;top:50%;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.055);
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.op1{width:200px;height:70px;}
.op2{width:320px;height:110px;}
.op3{width:460px;height:158px;}
.op4{width:620px;height:212px;}
.op5{width:800px;height:275px;}
.op6{width:1020px;height:350px;}
.op7{width:1280px;height:440px;}

/* Planet wrappers — rotate around centre */
.planet-arm{
  position:absolute;left:50%;top:50%;
  border-radius:50%;
  transform:translate(-50%,-50%);
}
/* Mercury */
.pa-mercury{width:200px;height:70px;animation:spin 5s linear infinite;}
/* Venus */
.pa-venus{width:320px;height:110px;animation:spin 12s linear infinite reverse;}
/* Earth */
.pa-earth{width:460px;height:158px;animation:spin 18s linear infinite;}
/* Mars */
.pa-mars{width:620px;height:212px;animation:spin 30s linear infinite reverse;}
/* Jupiter */
.pa-jupiter{width:800px;height:275px;animation:spin 60s linear infinite;}
/* Saturn */
.pa-saturn{width:1020px;height:350px;animation:spin 130s linear infinite reverse;}
/* Uranus */
.pa-uranus{width:1280px;height:440px;animation:spin 180s linear infinite;}

@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg);}
  to{transform:translate(-50%,-50%) rotate(360deg);}
}

/* Planet dots — positioned at leading edge of arm */
.planet{
  position:absolute;
  top:50%;left:0;
  transform:translate(-50%,-50%);
  border-radius:50%;
}
.p-mercury{width:9px;height:9px;background:radial-gradient(circle at 35% 30%,#d0cfc8,#8a8880);box-shadow:0 0 4px rgba(200,200,200,0.25);}
.p-venus{width:15px;height:15px;background:radial-gradient(circle at 35% 30%,#ffe9a0,#d4a520,#a07010);box-shadow:0 0 8px rgba(220,165,20,0.5);}
.p-earth{width:17px;height:17px;background:radial-gradient(circle at 35% 30%,#a8d8ff,#1a6bcc,#0a3a88);box-shadow:0 0 10px rgba(50,130,255,0.5);}
.p-mars{width:13px;height:13px;background:radial-gradient(circle at 35% 30%,#ff9966,#cc4400,#882200);box-shadow:0 0 7px rgba(200,60,0,0.45);}
.p-jupiter{width:34px;height:34px;background:radial-gradient(circle at 35% 30%,#f5deb3,#c8a870,#a07840);box-shadow:0 0 14px rgba(200,160,80,0.4);}
.p-saturn{width:26px;height:26px;background:radial-gradient(circle at 35% 30%,#ffe0a0,#c8a850,#a07030);box-shadow:0 0 12px rgba(220,180,80,0.35);}
.p-uranus{width:20px;height:20px;background:radial-gradient(circle at 35% 30%,#b0f0ff,#4cc0d0,#2090a0);box-shadow:0 0 9px rgba(80,200,220,0.4);}

/* Jupiter bands */
.p-jupiter::after{content:'';position:absolute;left:3px;top:40%;width:calc(100% - 6px);height:18%;background:rgba(160,100,50,0.4);border-radius:20px;}

/* Saturn ring */
.saturn-ring-wrap{
  position:absolute;top:50%;left:0;
  transform:translate(-50%,-50%);
  width:60px;height:60px;
}
.saturn-ring{
  position:absolute;inset:-6px;
  border-radius:50%;
  border:7px solid transparent;
  border-left-color:rgba(200,160,80,0.45);
  border-right-color:rgba(200,160,80,0.45);
  transform:rotateX(72deg) rotateZ(-15deg);
}

/* Asteroid belt hint */
.belt{
  position:absolute;left:50%;top:50%;
  width:710px;height:243px;
  border-radius:50%;
  border:2px dotted rgba(150,130,100,0.08);
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/* ═══════ NEBULA LAYER ═══════ */
#nebula{position:absolute;inset:0;pointer-events:none;}

/* ═══════ UNIVERSE AMBIENT ═══════ */
.ambient{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 100%,rgba(37,80,200,0.14) 0%,transparent 65%),
    radial-gradient(ellipse 50% 40% at 5% 60%,rgba(6,180,212,0.06) 0%,transparent 55%),
    radial-gradient(ellipse 40% 30% at 92% 20%,rgba(120,60,240,0.07) 0%,transparent 50%);
}

/* ═══════ LOGIN CARD ═══════ */
#card{
  position:fixed;
  right:7%;top:50%;
  transform:translateY(-50%);
  width:360px;
  z-index:100;
  background:rgba(6,12,28,0.82);
  border:1px solid rgba(59,130,246,0.28);
  border-radius:22px;
  padding:38px 34px 32px;
  backdrop-filter:blur(22px) saturate(1.4);
  box-shadow:
    0 8px 60px rgba(0,0,0,0.75),
    0 0 0 1px rgba(59,130,246,0.08) inset,
    0 0 80px rgba(37,99,235,0.07);
  animation:cardFloat 7s ease-in-out infinite;
}

/* Card shimmer line */
#card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;border-radius:22px 22px 0 0;
  background:linear-gradient(90deg,transparent 0%,rgba(59,130,246,0.5) 40%,rgba(6,182,212,0.4) 60%,transparent 100%);
}

@keyframes cardFloat{
  0%,100%{transform:translateY(-50%) translateY(0);}
  50%{transform:translateY(-50%) translateY(-10px);}
}

/* ── Card header ── */
.c-logo{display:flex;justify-content:center;margin-bottom:16px;}
.c-logo svg{filter:drop-shadow(0 0 10px rgba(59,130,246,0.35));}

.c-welcome{text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(100,150,255,0.65);margin-bottom:6px;}
.c-brand{text-align:center;font-family:'Syne',sans-serif;font-size:21px;font-weight:800;color:#f0f6ff;letter-spacing:-0.3px;}
.c-brand em{font-style:normal;color:#3b82f6;}
.c-sub{text-align:center;font-size:11.5px;color:rgba(100,120,165,0.7);letter-spacing:0.4px;margin-bottom:26px;margin-top:3px;}

/* ── Fields ── */
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:rgba(100,130,200,0.65);margin-bottom:7px;}
.field-wrap{position:relative;}
.fi{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(80,110,180,0.5);font-size:16px;pointer-events:none;transition:color 0.18s;}
.field-wrap:focus-within .fi{color:rgba(96,165,250,0.85);}
.field-input{
  width:100%;
  background:rgba(4,9,22,0.8);
  border:1px solid rgba(59,130,246,0.18);
  color:#e2e8f0;
  padding:11px 42px;
  border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:13px;
  outline:none;
  transition:all 0.2s;
}
.field-input::placeholder{color:rgba(80,105,160,0.45);}
.field-input:focus{border-color:rgba(59,130,246,0.55);background:rgba(4,9,22,0.95);box-shadow:0 0 0 3px rgba(59,130,246,0.1);}
.field-input.is-error{border-color:rgba(239,68,68,0.5);box-shadow:0 0 0 3px rgba(239,68,68,0.08);}
.eye-btn{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(80,110,180,0.5);font-size:16px;line-height:1;padding:4px;transition:color 0.15s;}
.eye-btn:hover{color:rgba(96,165,250,0.8);}

/* ── Options row ── */
.opts{display:flex;align-items:center;justify-content:space-between;margin:6px 0 20px;}
.remember{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:rgba(148,163,184,0.7);font-weight:400;user-select:none;}
.remember input{display:none;}
.chk{width:16px;height:16px;border:1.5px solid rgba(59,130,246,0.3);border-radius:4px;background:rgba(4,9,22,0.6);display:flex;align-items:center;justify-content:center;transition:all 0.18s;flex-shrink:0;}
.chk i{font-size:10px;color:#fff;opacity:0;transition:opacity 0.15s;}
.remember input:checked+.chk{background:var(--blue);border-color:var(--blue);}
.remember input:checked+.chk i{opacity:1;}
.forgot-link{background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:rgba(96,165,250,0.7);padding:0;transition:color 0.15s;}
.forgot-link:hover{color:#93c5fd;}

/* ── Login button ── */
.btn-cta{
  width:100%;height:50px;border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#1a3a8f 0%,#2563eb 50%,#3b82f6 100%);
  color:#fff;
  font-family:'Syne',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;
  position:relative;overflow:hidden;
  transition:transform 0.2s,box-shadow 0.2s;
  box-shadow:0 4px 24px rgba(37,99,235,0.4),0 1px 0 rgba(255,255,255,0.1) inset;
  letter-spacing:0.3px;
}
.btn-cta::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.12),transparent 60%);pointer-events:none;}
.btn-cta:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 36px rgba(37,99,235,0.5);}
.btn-cta:active:not(:disabled){transform:translateY(0);}
.btn-cta:disabled{opacity:0.65;cursor:not-allowed;}

/* ── Error / success msg ── */
.msg{display:none;margin-top:11px;font-size:12.5px;border-radius:9px;padding:10px 13px;font-weight:500;line-height:1.5;align-items:center;gap:8px;}
.msg.err{display:flex;background:rgba(239,68,68,0.1);color:#fca5a5;border:1px solid rgba(239,68,68,0.25);}
.msg.ok{display:flex;background:rgba(16,185,129,0.1);color:#6ee7b7;border:1px solid rgba(16,185,129,0.25);}
.msg i{font-size:14px;flex-shrink:0;}

/* ── Divider / links ── */
.card-links{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
.card-links a,.card-links button{font-family:'DM Sans',sans-serif;font-size:12px;color:rgba(96,165,250,0.65);text-decoration:none;background:none;border:none;cursor:pointer;padding:0;transition:color 0.15s;}
.card-links a:hover,.card-links button:hover{color:#93c5fd;}
.card-links .div{color:rgba(100,120,180,0.3);font-size:11px;}

/* ── Forgot view back ── */
.btn-back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:rgba(100,130,180,0.7);padding:0;margin-bottom:18px;transition:color 0.15s;}
.btn-back:hover{color:#93c5fd;}
.reset-hdr h3{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;color:#e2e8f0;margin-bottom:5px;}
.reset-hdr p{font-size:12.5px;color:rgba(100,120,165,0.7);line-height:1.6;margin-bottom:24px;}

/* views */
.view{display:none;}
.view.active{display:block;animation:vIn 0.28s cubic-bezier(0.22,1,0.36,1);}
@keyframes vIn{from{opacity:0;transform:translateX(10px);}to{opacity:1;transform:translateX(0);}}

/* spinner */
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spinA 0.6s linear infinite;flex-shrink:0;}
@keyframes spinA{to{transform:rotate(360deg);}}

/* trust bar */
.trust{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(59,130,246,0.1);}
.trust-item{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(100,120,165,0.55);}
.trust-item i{font-size:12px;color:rgba(59,130,246,0.55);}

/* ── Responsive ── */
@media(max-width:520px){
  #card{right:50%;transform:translate(50%,-50%);width:calc(100% - 32px);}
  @keyframes cardFloat{0%,100%{transform:translate(50%,-50%) translateY(0);}50%{transform:translate(50%,-50%) translateY(-6px);}}
}
</style>
</head>
<body>

<!-- ══ UNIVERSE ══ -->
<div id="universe">
  <canvas id="star-canvas"></canvas>
  <canvas id="nebula-canvas"></canvas>
  <div class="ambient"></div>

  <div class="solar">
    <!-- Orbit paths -->
    <div class="orbit-path op1"></div>
    <div class="orbit-path op2"></div>
    <div class="orbit-path op3"></div>
    <div class="orbit-path op4"></div>
    <div class="orbit-path op5"></div>
    <div class="orbit-path op6"></div>
    <div class="orbit-path op7"></div>

    <!-- Asteroid belt -->
    <div class="belt"></div>

    <!-- Corona / flares -->
    <div class="flare"></div>
    <div class="flare"></div>
    <div class="flare"></div>

    <!-- Sun -->
    <div id="sun"></div>

    <!-- Planets -->
    <div class="planet-arm pa-mercury"><div class="planet p-mercury"></div></div>
    <div class="planet-arm pa-venus"><div class="planet p-venus"></div></div>
    <div class="planet-arm pa-earth"><div class="planet p-earth"></div></div>
    <div class="planet-arm pa-mars"><div class="planet p-mars"></div></div>
    <div class="planet-arm pa-jupiter"><div class="planet p-jupiter"></div></div>
    <div class="planet-arm pa-saturn">
      <div class="saturn-ring-wrap"><div class="saturn-ring"></div></div>
      <div class="planet p-saturn"></div>
    </div>
    <div class="planet-arm pa-uranus"><div class="planet p-uranus"></div></div>
  </div>
</div>

<!-- ══ LOGIN CARD ══ -->
<div id="card">

  <!-- NVR Logo SVG -->
  <div class="c-logo">
    <svg viewBox="0 0 200 70" width="158" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="blu" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1a56db"/>
          <stop offset="55%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
        <linearGradient id="gld" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#d97706"/>
          <stop offset="100%" stop-color="#fbbf24"/>
        </linearGradient>
      </defs>
      <!-- N -->
      <rect x="2" y="6" width="7" height="42" rx="2" fill="url(#blu)"/>
      <polygon points="9,6 16,6 34,36 34,6 41,6 41,48 34,48 16,18 16,48 9,48" fill="url(#blu)"/>
      <!-- V -->
      <polygon points="47,6 58,6 71,38 84,6 95,6 76,48 66,48" fill="url(#blu)"/>
      <!-- R -->
      <rect x="101" y="6" width="7" height="42" rx="2" fill="url(#blu)"/>
      <path d="M108,6 h16 a14,14 0 0 1 0,24 h-16z" fill="url(#blu)"/>
      <line x1="124" y1="30" x2="140" y2="48" stroke="url(#blu)" stroke-width="7" stroke-linecap="round"/>
      <!-- Gold bars -->
      <rect x="2" y="54" width="148" height="5" rx="2.5" fill="url(#gld)"/>
      <rect x="2" y="61" width="110" height="3" rx="1.5" fill="url(#gld)" opacity="0.55"/>
      <!-- Labels -->
      <text x="2" y="70" font-family="'DM Sans',Arial,sans-serif" font-size="8.5" font-weight="600" fill="rgba(148,163,184,0.75)" letter-spacing="0.8">NetVision</text>
      <text x="62" y="70" font-family="'DM Sans',Arial,sans-serif" font-size="8.5" font-weight="400" fill="rgba(100,116,139,0.65)" letter-spacing="0.3">Resources</text>
    </svg>
  </div>

  <div class="c-welcome">Welcome to</div>
  <div class="c-brand">NetVision<em>Resources</em></div>
  <div class="c-sub">Your Recruiting Dashboard</div>

  <!-- ── LOGIN VIEW ── -->
  <div class="view active" id="viewLogin">

    <div class="field">
      <label for="loginEmail">Email Address</label>
      <div class="field-wrap">
        <i class="ri-mail-line fi"></i>
        <input class="field-input" type="email" id="loginEmail" placeholder="you@netvision.com" autocomplete="email">
      </div>
    </div>

    <div class="field">
      <label for="loginPassword">Password</label>
      <div class="field-wrap">
        <i class="ri-lock-2-line fi"></i>
        <input class="field-input" type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password">
        <button class="eye-btn" type="button" onclick="togglePwd('loginPassword',this)" tabindex="-1"><i class="ri-eye-off-line"></i></button>
      </div>
    </div>

    <div class="opts">
      <label class="remember">
        <input type="checkbox" id="rememberMe">
        <span class="chk"><i class="ri-check-line"></i></span>
        Remember me
      </label>
      <button class="forgot-link" onclick="showView('viewForgot')">Forgot password?</button>
    </div>

    <button class="btn-cta" id="loginBtn" onclick="doLogin()">
      <i class="ri-login-circle-line"></i> Sign In to Dashboard
    </button>

    <div class="msg" id="loginMsg"><i></i><span></span></div>

    <div class="card-links">
      <span style="font-size:12px;color:rgba(100,120,165,0.55);">Don't have an account?</span>
      <span class="div">|</span>
      <button onclick="showView('viewSignup')">Sign Up</button>
    </div>

    <div class="trust">
      <span class="trust-item"><i class="ri-shield-check-line"></i>Secure</span>
      <span class="trust-item"><i class="ri-lock-password-line"></i>Encrypted</span>
      <span class="trust-item"><i class="ri-server-line"></i>Supabase</span>
    </div>

  </div><!-- /viewLogin -->

  <!-- ── FORGOT VIEW ── -->
  <div class="view" id="viewForgot">
    <button class="btn-back" onclick="showView('viewLogin')"><i class="ri-arrow-left-s-line"></i> Back to Login</button>
    <div class="reset-hdr">
      <h3>Reset Password</h3>
      <p>Enter your email and we'll send a reset link to your inbox.</p>
    </div>
    <div class="field">
      <label for="forgotEmail">Email Address</label>
      <div class="field-wrap">
        <i class="ri-mail-send-line fi"></i>
        <input class="field-input" type="email" id="forgotEmail" placeholder="you@netvision.com">
      </div>
    </div>
    <button class="btn-cta" id="resetBtn" onclick="doForgot()">
      <i class="ri-send-plane-2-line"></i> Send Reset Link
    </button>
    <div class="msg" id="forgotMsg"><i></i><span></span></div>
  </div>

  <!-- ── SIGN UP VIEW ── -->
  <div class="view" id="viewSignup">
    <button class="btn-back" onclick="showView('viewLogin')"><i class="ri-arrow-left-s-line"></i> Back to Login</button>

<script>
/* ══ STARS ══ */
(function(){
  const c=document.getElementById('star-canvas');
  const ctx=c.getContext('2d');
  function resize(){c.width=innerWidth;c.height=innerHeight;}
  resize();addEventListener('resize',resize);
  const stars=[];
  for(let i=0;i<380;i++){
    stars.push({
      x:Math.random(),y:Math.random(),
      r:Math.random()*1.6+0.2,
      a:Math.random()*0.85+0.1,
      tw:Math.random()*Math.PI*2,
      hue:Math.random()<0.1?(200+Math.random()*40):0
    });
  }
  let t=0;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    t+=0.007;
    for(const s of stars){
      const alpha=Math.max(0.04,s.a+Math.sin(t+s.tw)*0.22);
      ctx.globalAlpha=alpha;
      if(s.hue){ctx.fillStyle=`hsl(${s.hue},70%,80%)`;}else{ctx.fillStyle='#fff';}
      ctx.beginPath();
      ctx.arc(s.x*c.width,s.y*c.height,s.r,0,Math.PI*2);
      ctx.fill();
    }
    // Shooting star
    if(Math.random()<0.003){
      const sx=Math.random()*c.width*0.7;
      const sy=Math.random()*c.height*0.35;
      ctx.globalAlpha=0.85;
      const g=ctx.createLinearGradient(sx,sy,sx+100,sy+36);
      g.addColorStop(0,'rgba(255,255,255,0.9)');g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=g;ctx.lineWidth=1.3;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+100,sy+36);ctx.stroke();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ══ NEBULA ══ */
(function(){
  const c=document.getElementById('nebula-canvas');
  c.style.cssText='position:absolute;inset:0;pointer-events:none;opacity:0.28;';
  const ctx=c.getContext('2d');
  function resize(){c.width=innerWidth;c.height=innerHeight;}
  resize();addEventListener('resize',resize);
  const clouds=[];
  for(let i=0;i<55;i++){
    clouds.push({
      x:0.15+Math.random()*0.7,y:0.15+Math.random()*0.7,
      r:Math.random()*4+1.5,
      hue:Math.random()<0.5?(200+Math.random()*50):(260+Math.random()*40),
      tw:Math.random()*Math.PI*2
    });
  }
  let t=0;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    t+=0.004;
    for(const d of clouds){
      ctx.globalAlpha=0.12+0.08*Math.sin(t+d.tw);
      ctx.fillStyle=`hsl(${d.hue},75%,65%)`;
      ctx.beginPath();
      ctx.arc(d.x*c.width,d.y*c.height,d.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();

window.addEventListener('load',()=>{
  const saved=localStorage.getItem('nvr_remember_email');

/* ══ VIEWS ══ */
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  clearMsgs();
}
function clearMsgs(){
  document.querySelectorAll('.msg').forEach(m=>{m.className='msg';try{m.querySelector('i').className='';m.querySelector('span').textContent='';}catch(e){}});
}

function togglePwd(inputId,btn){
  const inp=document.getElementById(inputId);
  const ico=btn.querySelector('i');
  if(inp.type==='password'){inp.type='text';ico.className='ri-eye-line';}
  else{inp.type='password';ico.className='ri-eye-off-line';}
}

function showMsg(id,text,type='err'){
  const el=document.getElementById(id);
  el.className='msg '+type;
  el.querySelector('i').className=type==='err'?'ri-error-warning-line':'ri-checkbox-circle-line';
  el.querySelector('span').textContent=text;
}

/* ══ LOGIN ══ */
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const remember=document.getElementById('rememberMe').checked;
  const btn=document.getElementById('loginBtn');
  document.getElementById('loginEmail').classList.remove('is-error');
  document.getElementById('loginPassword').classList.remove('is-error');
  if(!email){document.getElementById('loginEmail').classList.add('is-error');showMsg('loginMsg','Please enter your email address.');return;}
  if(!password){document.getElementById('loginPassword').classList.add('is-error');showMsg('loginMsg','Please enter your password.');return;}
  btn.disabled=true;
  btn.innerHTML='<div class="spin"></div> Signing in…';
  const{error}=await sb.auth.signInWithPassword({email,password});
  if(error){
    showMsg('loginMsg',error.message||'Invalid credentials. Please try again.');
    document.getElementById('loginPassword').classList.add('is-error');
    btn.disabled=false;
    btn.innerHTML='<i class="ri-login-circle-line"></i> Sign In to Dashboard';
    return;
  }
  if(remember)localStorage.setItem('nvr_remember_email',email);
  else localStorage.removeItem('nvr_remember_email');
  btn.innerHTML='<i class="ri-checkbox-circle-line"></i> Success! Redirecting…';
  btn.style.background='linear-gradient(135deg,#064e3b,#059669)';
  setTimeout(()=>{location.href='dashboard.html';},800);
}

/* ══ FORGOT ══ */
async function doForgot(){
  const email=document.getElementById('forgotEmail').value.trim();
  const btn=document.getElementById('resetBtn');
  document.getElementById('forgotEmail').classList.remove('is-error');
  if(!email){document.getElementById('forgotEmail').classList.add('is-error');showMsg('forgotMsg','Please enter your email address.');return;}
  btn.disabled=true;
  btn.innerHTML='<div class="spin"></div> Sending…';
  const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/reset.html'});
  if(error){showMsg('forgotMsg',error.message||'Something went wrong.');btn.disabled=false;btn.innerHTML='<i class="ri-send-plane-2-line"></i> Send Reset Link';return;}
  showMsg('forgotMsg','Reset link sent! Check your inbox.','ok');
  btn.innerHTML='<i class="ri-mail-check-line"></i> Email Sent';
  btn.style.background='linear-gradient(135deg,#064e3b,#059669)';
}

/* ══ SIGNUP ══ */
async function doSignup(){
  const email=document.getElementById('signupEmail').value.trim();
  const password=document.getElementById('signupPassword').value;
  const btn=document.getElementById('signupBtn');
  if(!email||!password){showMsg('signupMsg','Please fill in all fields.');return;}
  if(password.length<6){showMsg('signupMsg','Password must be at least 6 characters.');return;}
  btn.disabled=true;
  btn.innerHTML='<div class="spin"></div> Creating…';
  const{error}=await sb.auth.signUp({email,password});
  if(error){showMsg('signupMsg',error.message||'Signup failed.');btn.disabled=false;btn.innerHTML='<i class="ri-user-add-line"></i> Create Account';return;}
  showMsg('signupMsg','Account created! Check your email to verify.','ok');
  btn.innerHTML='<i class="ri-checkbox-circle-line"></i> Verify Email';
  btn.style.background='linear-gradient(135deg,#064e3b,#059669)';
}
</script>
