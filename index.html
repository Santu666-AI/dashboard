<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetVision Resources | ATS Login</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; font-family:'Segoe UI',sans-serif; overflow:hidden; }

.page{ display:flex; height:100vh; width:100vw; }

/* LEFT — image fills full height */
.left{ flex:1; position:relative; overflow:hidden; }
.left img.bg-img{
  width:100%; height:100%;
  object-fit:cover; object-position:center left;
  display:block;
}
.left::after{
  content:''; position:absolute;
  top:0; right:0; bottom:0; width:80px;
  background:linear-gradient(to right,transparent,#fff);
  pointer-events:none;
}

/* RIGHT — white card panel */
.right{
  width:460px; flex-shrink:0;
  background:#fff;
  display:flex; align-items:center; justify-content:center;
  padding:40px 48px;
  box-shadow:-6px 0 40px rgba(0,0,0,0.08);
  overflow-y:auto;
}
.card{ width:100%; }

.logo{ text-align:center; margin-bottom:6px; }
.logo img{ width:210px; max-width:100%; }

.title{ text-align:center; margin-bottom:30px; }
.title h2{ font-size:22px; font-weight:800; color:#1d4ed8; margin-bottom:3px; }
.title .sub{ font-size:13.5px; color:#6b7280; }

.view{ display:none; }
.view.active{ display:block; }

.field{ position:relative; margin-bottom:14px; }
.field .fi{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color:#9ca3af; font-size:17px; pointer-events:none;
}
.field input{
  width:100%; height:50px; padding:0 46px 0 44px;
  border:1.5px solid #e5e7eb; border-radius:12px;
  font-size:14px; color:#111827; outline:none;
  background:#f9fafb;
  transition:border-color 0.15s,box-shadow 0.15s,background 0.15s;
}
.field input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,0.1);
  background:#fff;
}
.eye-btn{
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer;
  color:#9ca3af; font-size:17px; padding:0; line-height:1;
}
.eye-btn:hover{ color:#6b7280; }

.row-rf{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px; font-size:13px;
}
.row-rf label{
  display:flex; align-items:center; gap:7px;
  color:#374151; cursor:pointer; user-select:none;
}
.row-rf input[type=checkbox]{ width:15px;height:15px; accent-color:#2563eb; cursor:pointer; }
.link{
  color:#2563eb; font-weight:500; cursor:pointer;
  background:none; border:none; font-size:13px;
  padding:0; font-family:inherit;
}
.link:hover{ text-decoration:underline; }

.btn-primary{
  width:100%; height:50px; border:none; border-radius:12px;
  background:linear-gradient(90deg,#2563eb,#1d4ed8);
  color:#fff; font-size:15px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:opacity 0.15s,transform 0.1s;
  font-family:inherit; letter-spacing:0.2px;
}
.btn-primary:hover:not(:disabled){ opacity:0.88; transform:translateY(-1px); }
.btn-primary:active:not(:disabled){ transform:translateY(0); }
.btn-primary:disabled{ opacity:0.6; cursor:default; }

.btn-back{
  background:none; border:none; color:#6b7280;
  font-size:13px; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  padding:0; margin-bottom:18px; font-family:inherit;
}
.btn-back:hover{ color:#1d4ed8; }

.msg{
  margin-top:12px; font-size:13px;
  border-radius:9px; padding:9px 13px;
  display:none; text-align:center;
}
.msg.error{ display:block; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
.msg.success{ display:block; background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }

.reset-head{ margin-bottom:22px; }
.reset-head h3{ font-size:18px;font-weight:700;color:#111827;margin-bottom:5px; }
.reset-head p{ font-size:13px;color:#6b7280; }

.footer-text{ text-align:center; margin-top:24px; font-size:12px; color:#9ca3af; }

@keyframes spin{ to{ transform:rotate(360deg); } }
.spin{
  width:17px;height:17px;
  border:2px solid rgba(255,255,255,0.35);
  border-top-color:#fff; border-radius:50%;
  animation:spin 0.65s linear infinite; flex-shrink:0;
}

@media(max-width:860px){
  .left{ display:none; }
  .right{ width:100vw; padding:40px 28px; }
}
</style>
</head>
<body>

<div class="page">

  <!-- LEFT: full background image -->
  <div class="left">
    <img class="bg-img" src="login_bg_png.png" alt="">
  </div>

  <!-- RIGHT: card -->
  <div class="right">
  <div class="card">

    <div class="logo">
      <img src="logo.png" alt="NetVision Resources">
    </div>
    <div class="title">
      <h2>NetVision Resources</h2>
      <div class="sub">Your Recruiting Dashboard</div>
    </div>

    <!-- LOGIN -->
    <div class="view active" id="viewLogin">
      <div class="field">
        <i class="ri-user-3-line fi"></i>
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
      </div>
      <div class="field">
        <i class="ri-lock-2-line fi"></i>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button class="eye-btn" type="button" onclick="togglePwd('loginPassword',this)">
          <i class="ri-eye-off-line"></i>
        </button>
      </div>
      <div class="row-rf">
        <label><input type="checkbox" id="rememberMe"> Remember me</label>
        <button class="link" onclick="showView('viewForgot')">Forgot password?</button>
      </div>
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">
        <i class="ri-login-circle-line"></i> Login
      </button>
      <div class="msg" id="loginMsg"></div>
      <div class="footer-text">© 2026 NetVision Resources Inc.</div>
    </div>

    <!-- FORGOT PASSWORD -->
    <div class="view" id="viewForgot">
      <button class="btn-back" onclick="showView('viewLogin')">
        <i class="ri-arrow-left-line"></i> Back to Login
      </button>
      <div class="reset-head">
        <h3>Reset Password</h3>
        <p>Enter your email and we'll send you a secure reset link.</p>
      </div>
      <div class="field">
        <i class="ri-mail-line fi"></i>
        <input type="email" id="forgotEmail" placeholder="Email address" autocomplete="email">
      </div>
      <button class="btn-primary" id="resetBtn" onclick="doForgot()">
        <i class="ri-send-plane-line"></i> Send Reset Link
      </button>
      <div class="msg" id="forgotMsg"></div>
      <div class="footer-text">© 2026 NetVision Resources Inc.</div>
    </div>

  </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ftxrrgdmkpnghxilnpsk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0eHJyZ2Rta3BuZ2h4aWxucHNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2MDY0MzYsImV4cCI6MjA4NzE4MjQzNn0.KcqIN2ynBQWmglQ_-6eaFi3TGPSclB0TgeJ83XU_OWI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Auto-redirect if session exists */
(async()=>{
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(session) window.location.href = "dashboard.html";
  }catch(e){}
})();

/* Pre-fill remembered email */
window.addEventListener("load",()=>{
  const saved = localStorage.getItem("nvr_remember_email");
  if(saved){ document.getElementById("loginEmail").value=saved; document.getElementById("rememberMe").checked=true; }
  document.getElementById("loginPassword").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
  document.getElementById("loginEmail").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
});

function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".msg").forEach(m=>{ m.className="msg"; m.textContent=""; });
}

function togglePwd(inputId,btn){
  const inp=document.getElementById(inputId), ico=btn.querySelector("i");
  if(inp.type==="password"){ inp.type="text"; ico.className="ri-eye-line"; }
  else{ inp.type="password"; ico.className="ri-eye-off-line"; }
}

function showMsg(id,text,type="error"){
  const el=document.getElementById(id);
  el.textContent=text; el.className="msg "+type;
}

async function doLogin(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  const remember=document.getElementById("rememberMe").checked;
  const btn=document.getElementById("loginBtn");
  if(!email||!password){ showMsg("loginMsg","Please enter your email and password."); return; }
  btn.disabled=true;
  btn.innerHTML=`<div class="spin"></div> Signing in...`;
  const { error }=await sb.auth.signInWithPassword({email,password});
  if(error){
    showMsg("loginMsg",error.message);
    btn.disabled=false;
    btn.innerHTML=`<i class="ri-login-circle-line"></i> Login`;
    return;
  }
  if(remember) localStorage.setItem("nvr_remember_email",email);
  else localStorage.removeItem("nvr_remember_email");
  btn.innerHTML=`<i class="ri-check-double-line"></i> Success! Redirecting...`;
  setTimeout(()=>{ window.location.href="dashboard.html"; },500);
}

async function doForgot(){
  const email=document.getElementById("forgotEmail").value.trim();
  const btn=document.getElementById("resetBtn");
  if(!email){ showMsg("forgotMsg","Please enter your email address."); return; }
  btn.disabled=true;
  btn.innerHTML=`<div class="spin"></div> Sending...`;
  const { error }=await sb.auth.resetPasswordForEmail(email,{
    redirectTo: window.location.origin+"/reset.html"
  });
  if(error){
    showMsg("forgotMsg",error.message);
    btn.disabled=false;
    btn.innerHTML=`<i class="ri-send-plane-line"></i> Send Reset Link`;
    return;
  }
  showMsg("forgotMsg","✅ Reset link sent! Check your inbox.","success");
  btn.innerHTML=`<i class="ri-mail-check-line"></i> Email Sent`;
}
</script>
</body>
</html>
