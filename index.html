<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetVision Resources | Recruiting Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
<style>
/* ─── RESET & BASE ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue-900: #0d1f4c;
  --blue-700: #1440a0;
  --blue-600: #1a52c4;
  --blue-500: #2563eb;
  --blue-400: #3b82f6;
  --blue-100: #dbeafe;
  --orange:   #f97316;
  --gold:     #fbbf24;
  --white:    #ffffff;
  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-800: #1e293b;
  --slate-900: #0f172a;
  --radius-card: 28px;
  --radius-input: 14px;
  --shadow-card: 0 32px 96px rgba(13, 31, 76, 0.28), 0 8px 32px rgba(13, 31, 76, 0.12);
  --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
  height: 100%;
  font-family: 'Outfit', sans-serif;
  overflow: hidden;
}

/* ─── ANIMATED BACKGROUND ─── */
.stage {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0a1628 0%, #0d2050 35%, #0f3470 65%, #0a2a60 100%);
  overflow: hidden;
}

/* Mesh orbs */
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
  animation: drift 18s ease-in-out infinite;
}
.orb-1 {
  width: 520px; height: 520px;
  background: radial-gradient(circle, rgba(37,99,235,0.35), rgba(37,99,235,0.02));
  top: -100px; left: -120px;
  animation-delay: 0s;
}
.orb-2 {
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(249,115,22,0.18), transparent);
  top: 60%; right: 5%;
  animation-delay: -6s;
  animation-duration: 22s;
}
.orb-3 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(59,130,246,0.22), transparent);
  bottom: -60px; left: 30%;
  animation-delay: -12s;
  animation-duration: 15s;
}
.orb-4 {
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(251,191,36,0.10), transparent);
  top: 20%; right: 25%;
  animation-delay: -4s;
  animation-duration: 26s;
}

@keyframes drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%       { transform: translate(30px, -40px) scale(1.05); }
  66%       { transform: translate(-20px, 25px) scale(0.97); }
}

/* Grid overlay */
.grid-overlay {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* Floating data nodes */
.nodes {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.node {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(99,179,237,0.6);
  animation: nodeFloat 8s ease-in-out infinite;
}
.node::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1px solid rgba(99,179,237,0.2);
  animation: nodePulse 3s ease-in-out infinite;
}
@keyframes nodeFloat {
  0%, 100% { transform: translateY(0); opacity: 0.6; }
  50%       { transform: translateY(-14px); opacity: 1; }
}
@keyframes nodePulse {
  0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.5; }
  50%       { transform: translate(-50%,-50%) scale(1.6); opacity: 0; }
}

/* ─── LAYOUT ─── */
.layout {
  position: relative;
  z-index: 10;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* ─── CARD ─── */
.card {
  width: 100%;
  max-width: 460px;
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(20px);
  border-radius: var(--radius-card);
  padding: 48px 44px 40px;
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(255,255,255,0.6);
  animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(32px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ─── BRAND ─── */
.brand {
  text-align: center;
  margin-bottom: 32px;
}
.brand-logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.brand-icon {
  width: 46px; height: 46px;
  background: linear-gradient(135deg, var(--blue-600), var(--blue-500));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(37,99,235,0.35);
  flex-shrink: 0;
}
.brand-icon i { font-size: 22px; color: #fff; }
.brand-wordmark {
  text-align: left;
  line-height: 1.1;
}
.brand-wordmark .net { font-size: 18px; font-weight: 700; color: var(--blue-700); letter-spacing: -0.3px; }
.brand-wordmark .vision { font-size: 18px; font-weight: 800; color: var(--blue-500); letter-spacing: -0.3px; }
.brand-wordmark .resources { font-size: 10px; font-weight: 600; color: var(--slate-400); letter-spacing: 1.5px; text-transform: uppercase; }

.brand-tagline {
  font-size: 13px;
  color: var(--slate-500);
  font-weight: 400;
}
.brand-tagline strong {
  color: var(--slate-800);
  font-weight: 600;
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 26px;
}
.divider-line {
  flex: 1;
  height: 1px;
  background: var(--slate-200);
}
.divider-label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--slate-400);
  letter-spacing: 1px;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ─── VIEWS ─── */
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(8px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ─── FORM FIELDS ─── */
.field-group { margin-bottom: 14px; }
.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--slate-600);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 7px;
}
.field-wrap {
  position: relative;
}
.field-icon {
  position: absolute;
  left: 15px;
  top: 50%; transform: translateY(-50%);
  color: var(--slate-400);
  font-size: 18px;
  pointer-events: none;
  transition: color var(--transition);
}
.field-wrap:focus-within .field-icon { color: var(--blue-500); }

.field-input {
  width: 100%;
  height: 52px;
  padding: 0 48px 0 46px;
  border: 1.5px solid var(--slate-200);
  border-radius: var(--radius-input);
  font-family: 'Outfit', sans-serif;
  font-size: 14.5px;
  color: var(--slate-900);
  background: var(--slate-50);
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}
.field-input::placeholder { color: var(--slate-400); }
.field-input:focus {
  border-color: var(--blue-500);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
}
.field-input.error {
  border-color: #ef4444;
  box-shadow: 0 0 0 3px rgba(239,68,68,0.08);
}

.eye-btn {
  position: absolute;
  right: 13px;
  top: 50%; transform: translateY(-50%);
  background: none; border: none;
  color: var(--slate-400);
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center;
  padding: 4px;
  transition: color var(--transition);
  line-height: 1;
}
.eye-btn:hover { color: var(--blue-500); }

/* ─── OPTIONS ROW ─── */
.options-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  margin-top: 4px;
}
.remember-label {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer;
  font-size: 13.5px;
  color: var(--slate-600);
  font-weight: 500;
  user-select: none;
}
.remember-label input[type="checkbox"] {
  display: none;
}
.custom-check {
  width: 18px; height: 18px;
  border: 2px solid var(--slate-300);
  border-radius: 5px;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}
.custom-check i { font-size: 11px; color: #fff; opacity: 0; transition: opacity 0.15s; }
.remember-label input:checked + .custom-check {
  background: var(--blue-500);
  border-color: var(--blue-500);
}
.remember-label input:checked + .custom-check i { opacity: 1; }

.forgot-btn {
  background: none; border: none;
  color: var(--blue-500);
  font-family: 'Outfit', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  transition: color var(--transition);
}
.forgot-btn:hover { color: var(--blue-700); text-decoration: underline; }

/* ─── PRIMARY BUTTON ─── */
.btn-primary {
  width: 100%;
  height: 54px;
  border: none;
  border-radius: var(--radius-input);
  background: linear-gradient(135deg, var(--blue-600) 0%, var(--blue-500) 60%, #3b82f6 100%);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: 15.5px;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  letter-spacing: 0.2px;
  position: relative;
  overflow: hidden;
  transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
  box-shadow: 0 8px 28px rgba(37, 99, 235, 0.32);
}
.btn-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
}
.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(37, 99, 235, 0.42);
}
.btn-primary:active:not(:disabled) {
  transform: translateY(0);
  box-shadow: 0 4px 16px rgba(37, 99, 235, 0.28);
}
.btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }

/* ─── BACK BUTTON ─── */
.btn-back {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: none;
  color: var(--slate-500);
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  margin-bottom: 22px;
  transition: color var(--transition);
}
.btn-back:hover { color: var(--blue-500); }

/* ─── MESSAGES ─── */
.msg {
  margin-top: 14px;
  font-size: 13px;
  border-radius: 10px;
  padding: 11px 15px;
  display: none;
  text-align: center;
  font-weight: 500;
  line-height: 1.5;
}
.msg.error {
  display: flex; align-items: center; gap: 9px;
  background: #fff5f5;
  color: #c53030;
  border: 1px solid #fed7d7;
}
.msg.success {
  display: flex; align-items: center; gap: 9px;
  background: #f0fff4;
  color: #276749;
  border: 1px solid #c6f6d5;
}
.msg i { font-size: 16px; flex-shrink: 0; }

/* ─── FOOTER ─── */
.card-footer {
  text-align: center;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--slate-100);
}
.footer-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  font-size: 11.5px;
  color: var(--slate-400);
}
.footer-meta span { display: flex; align-items: center; gap: 4px; }
.footer-meta i { font-size: 12px; }

/* ─── RESET VIEW ─── */
.reset-header { margin-bottom: 24px; }
.reset-header h3 {
  font-size: 20px;
  font-weight: 800;
  color: var(--slate-900);
  margin-bottom: 6px;
  letter-spacing: -0.3px;
}
.reset-header p {
  font-size: 13.5px;
  color: var(--slate-500);
  line-height: 1.6;
}

/* ─── SPINNER ─── */
.spin {
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── SUCCESS STATE ─── */
.success-icon {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, #48bb78, #38a169);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px;
  box-shadow: 0 8px 24px rgba(56,161,105,0.3);
  animation: scaleIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.success-icon i { font-size: 28px; color: #fff; }
@keyframes scaleIn {
  from { transform: scale(0); }
  to   { transform: scale(1); }
}

/* ─── DECORATIVE BADGE ─── */
.secure-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(37,99,235,0.07);
  border: 1px solid rgba(37,99,235,0.15);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--blue-600);
  letter-spacing: 0.3px;
  margin-bottom: 20px;
}
.secure-badge i { font-size: 11px; }

/* ─── STRENGTH INDICATOR ─── */
.strength-bar {
  height: 3px;
  background: var(--slate-100);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
  display: none;
}
.strength-bar.visible { display: block; }
.strength-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s, background 0.3s;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 520px) {
  .layout { padding: 16px; }
  .card { padding: 36px 24px 30px; border-radius: 20px; }
}
</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="stage">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
  <div class="grid-overlay"></div>
  <div class="nodes" id="nodes"></div>
</div>

<!-- LAYOUT -->
<div class="layout">
  <div class="card" role="main">

    <!-- BRAND -->
    <div class="brand">
      <div class="brand-logo">
        <div class="brand-icon">
          <i class="ri-user-star-line"></i>
        </div>
        <div class="brand-wordmark">
          <div><span class="net">NetVision</span><span class="vision">Resources</span></div>
          <div class="resources">Staffing & Recruitment</div>
        </div>
      </div>
      <div class="brand-tagline">Welcome back — <strong>Your Recruiting Dashboard</strong></div>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-label">Sign In</div>
      <div class="divider-line"></div>
    </div>

    <!-- ── LOGIN VIEW ── -->
    <div class="view active" id="viewLogin">
      <div style="text-align:center; margin-bottom:18px;">
        <span class="secure-badge"><i class="ri-shield-check-line"></i> Secure Login</span>
      </div>

      <div class="field-group">
        <label class="field-label" for="loginEmail">Email Address</label>
        <div class="field-wrap">
          <i class="ri-mail-line field-icon"></i>
          <input class="field-input" type="email" id="loginEmail" placeholder="you@netvision.com" autocomplete="email">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="loginPassword">Password</label>
        <div class="field-wrap">
          <i class="ri-lock-2-line field-icon"></i>
          <input class="field-input" type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
          <button class="eye-btn" type="button" onclick="togglePwd('loginPassword',this)" tabindex="-1" aria-label="Toggle password">
            <i class="ri-eye-off-line"></i>
          </button>
        </div>
      </div>

      <div class="options-row">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe">
          <span class="custom-check"><i class="ri-check-line"></i></span>
          Remember me
        </label>
        <button class="forgot-btn" onclick="showView('viewForgot')">Forgot password?</button>
      </div>

      <button class="btn-primary" id="loginBtn" onclick="doLogin()">
        <i class="ri-login-circle-line"></i>
        Sign In to Dashboard
      </button>

      <div class="msg" id="loginMsg"><i class="ri-error-warning-line"></i><span></span></div>

      <div class="card-footer">
        <div class="footer-meta">
          <span><i class="ri-lock-fill"></i> 256-bit SSL</span>
          <span><i class="ri-shield-check-fill"></i> SOC 2 Compliant</span>
          <span><i class="ri-time-line"></i> © 2026 NVR</span>
        </div>
      </div>
    </div>

    <!-- ── FORGOT PASSWORD VIEW ── -->
    <div class="view" id="viewForgot">
      <button class="btn-back" onclick="showView('viewLogin')">
        <i class="ri-arrow-left-s-line"></i> Back to Sign In
      </button>

      <div class="reset-header">
        <h3>Reset your password</h3>
        <p>Enter your registered email and we'll send you a secure link to reset your password.</p>
      </div>

      <div class="field-group">
        <label class="field-label" for="forgotEmail">Email Address</label>
        <div class="field-wrap">
          <i class="ri-mail-send-line field-icon"></i>
          <input class="field-input" type="email" id="forgotEmail" placeholder="you@netvision.com" autocomplete="email">
        </div>
      </div>

      <button class="btn-primary" id="resetBtn" onclick="doForgot()">
        <i class="ri-send-plane-2-line"></i>
        Send Reset Link
      </button>

      <div class="msg" id="forgotMsg"><i></i><span></span></div>

      <div class="card-footer">
        <div class="footer-meta">
          <span><i class="ri-shield-check-fill"></i> Secure reset link expires in 60 min</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ─── SUPABASE ─── */
const SUPABASE_URL = "https://ftxrrgdmkpnghxilnpsk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0eHJyZ2Rta3BuZ2h4aWxucHNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2MDY0MzYsImV4cCI6MjA4NzE4MjQzNn0.KcqIN2ynBQWmglQ_-6eaFi3TGPSclB0TgeJ83XU_OWI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = "dashboard.html";
  } catch(e) {}
})();

/* ─── FLOATING NODES ─── */
(function createNodes() {
  const container = document.getElementById('nodes');
  const positions = [
    [8,15],[25,72],[15,45],[80,25],[72,60],[90,80],[45,10],[60,90],[35,55],[88,42]
  ];
  positions.forEach(([l,t], i) => {
    const n = document.createElement('div');
    n.className = 'node';
    n.style.cssText = `left:${l}%;top:${t}%;animation-delay:${-i*0.9}s;animation-duration:${7+i*0.5}s`;
    container.appendChild(n);
  });
})();

/* ─── REMEMBERED EMAIL ─── */
window.addEventListener('load', () => {
  const saved = localStorage.getItem('nvr_remember_email');
  if (saved) {
    document.getElementById('loginEmail').value = saved;
    document.getElementById('rememberMe').checked = true;
  }

  // Enter key support
  ['loginEmail','loginPassword'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });
  document.getElementById('forgotEmail').addEventListener('keydown', e => {
    if (e.key === 'Enter') doForgot();
  });
});

/* ─── VIEW SWITCHER ─── */
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  clearMsgs();
}

function clearMsgs() {
  document.querySelectorAll('.msg').forEach(m => {
    m.className = 'msg';
    m.querySelector('i').className = '';
    m.querySelector('span').textContent = '';
  });
}

/* ─── PASSWORD TOGGLE ─── */
function togglePwd(inputId, btn) {
  const inp = document.getElementById(inputId);
  const ico = btn.querySelector('i');
  if (inp.type === 'password') {
    inp.type = 'text';
    ico.className = 'ri-eye-line';
  } else {
    inp.type = 'password';
    ico.className = 'ri-eye-off-line';
  }
}

/* ─── SHOW MESSAGE ─── */
function showMsg(id, text, type = 'error') {
  const el = document.getElementById(id);
  el.className = 'msg ' + type;
  el.querySelector('i').className = type === 'error' ? 'ri-error-warning-line' : 'ri-checkbox-circle-line';
  el.querySelector('span').textContent = text;
}

/* ─── LOGIN ─── */
async function doLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const remember = document.getElementById('rememberMe').checked;
  const btn      = document.getElementById('loginBtn');

  // Field validation
  document.getElementById('loginEmail').classList.remove('error');
  document.getElementById('loginPassword').classList.remove('error');

  if (!email) {
    document.getElementById('loginEmail').classList.add('error');
    showMsg('loginMsg', 'Please enter your email address.');
    document.getElementById('loginEmail').focus();
    return;
  }
  if (!password) {
    document.getElementById('loginPassword').classList.add('error');
    showMsg('loginMsg', 'Please enter your password.');
    document.getElementById('loginPassword').focus();
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Signing in…';

  const { error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    showMsg('loginMsg', error.message || 'Invalid credentials. Please try again.');
    document.getElementById('loginPassword').classList.add('error');
    btn.disabled = false;
    btn.innerHTML = '<i class="ri-login-circle-line"></i> Sign In to Dashboard';
    return;
  }

  if (remember) localStorage.setItem('nvr_remember_email', email);
  else localStorage.removeItem('nvr_remember_email');

  btn.innerHTML = '<i class="ri-checkbox-circle-line"></i> Success! Redirecting…';
  btn.style.background = 'linear-gradient(135deg,#38a169,#48bb78)';
  setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
}

/* ─── FORGOT PASSWORD ─── */
async function doForgot() {
  const email = document.getElementById('forgotEmail').value.trim();
  const btn   = document.getElementById('resetBtn');

  document.getElementById('forgotEmail').classList.remove('error');

  if (!email) {
    document.getElementById('forgotEmail').classList.add('error');
    showMsg('forgotMsg', 'Please enter your email address.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Sending…';

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset.html'
  });

  if (error) {
    showMsg('forgotMsg', error.message || 'Something went wrong. Please try again.');
    btn.disabled = false;
    btn.innerHTML = '<i class="ri-send-plane-2-line"></i> Send Reset Link';
    return;
  }

  showMsg('forgotMsg', 'Reset link sent! Check your inbox (and spam folder).', 'success');
  btn.innerHTML = '<i class="ri-mail-check-line"></i> Email Sent';
  btn.style.background = 'linear-gradient(135deg,#38a169,#48bb78)';
}
</script>
